<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Container Tracker</title>
  <meta name="description" content="See where your shipping container is, in plain language.">
  <meta name="theme-color" content="#F6F3F1">

  <!-- iOS home screen app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Containers">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">

  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app">
    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Main">
      <a href="#/home" data-tab="home" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </a>
      <a href="#/shipments" data-tab="shipments" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M7 7v12M11 7v12M15 7v12M19 7v12" stroke-width="1.4"/></svg>
        <span>Shipments</span>
      </a>
      <button type="button" class="tab-fab" id="fab" aria-label="Search a container">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      </button>
      <a href="#/track" data-tab="track" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
        <span>Tracking</span>
      </a>
      <a href="#/help" data-tab="help" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.6"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
        <span>Help</span>
      </a>
    </nav>
  </div>

  <!-- Shown on desktop/tablet: the app is designed for iPhone -->
  <div id="desktop-note" class="desktop-note" hidden>
    <div class="desktop-card">
      <div class="desktop-ship" data-ship></div>
      <h1>Made for iPhone</h1>
      <p>This tracker is designed for iPhone screens. Open this page in Safari on your iPhone, then tap <b>Share</b> and <b>Add to Home Screen</b> to install it.</p>
      <p class="desktop-url" id="desktop-url"></p>
      <button type="button" class="btn btn-dark" id="desktop-continue">Preview it here anyway</button>
    </div>
  </div>

  <script src="/vendor/leaflet/leaflet.js" defer></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
